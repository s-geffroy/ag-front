# Docker-only tooling for app-geo. The `tools` service is the ONLY way to run
# project commands (npm, builds, tests, agent-browser). Nothing on the host.
#
#   docker compose -f docker/docker-compose.yml build tools
#   docker compose -f docker/docker-compose.yml run --rm tools npm install
#   docker compose -f docker/docker-compose.yml run --rm tools npm run test
#
# UID/GID default to 1000; override for other hosts via docker/.env (see .env.example).
name: app-geo

services:
  tools:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: app-geo-tools:local
    # Run as the host user so files written into the mounted repo stay owned by you.
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      # Build-time Atlas ↔ Chokepoints Read API (read scope). Token via docker/.env; empty = graceful
      # build (Atlas omits the chokepoints section). The token is NEVER shipped to the client.
      CHOKEPOINTS_API_URL: ${CHOKEPOINTS_API_URL:-https://srv1305127.tail880531.ts.net/api}
      CHOKEPOINTS_API_TOKEN: ${CHOKEPOINTS_API_TOKEN:-}
      # Go-live gate for the public derived-Polymarket-consensus block (ADR 0071). Empty/unset = dark
      # (the block never renders even though the data path is wired). Set to '1' in docker/.env ONLY
      # after ag-back confirms the derived aggregate is redistributable on the open internet.
      ATLAS_CONSENSUS_PUBLIC: ${ATLAS_CONSENSUS_PUBLIC:-}
    ports:
      - '127.0.0.1:5173:5173' # apps/cockpit dev server (Vite) — Phase 2
      - '127.0.0.1:4321:4321' # apps/public dev server (Astro) — Phase 3
    # Sensible default so `run --rm tools` with no args drops into a shell.
    command: ['bash']

  # Deck/PDF toolchain (ADR 0073): LibreOffice + poppler + qpdf + the vendored `pptx`/`pdf` skill
  # scripts. Separate image so the everyday `tools` service stays slim — build it only when a
  # plaquette is regenerated. Driven by scripts/build-deck.sh, never invoked by hand in normal use.
  #
  #   docker compose -f docker/docker-compose.yml build slides
  slides:
    build:
      context: ..
      dockerfile: docker/slides.Dockerfile
    image: app-geo-slides:local
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ['bash']

  # Production cockpit server (built SPA + editable /api). Published on the host loopback only;
  # Tailscale serve fronts it as tailnet-only HTTPS (ADR 0005 / 0009). Never bind to 0.0.0.0 on host.
  cockpit:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: app-geo-tools:local
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      HOST: '0.0.0.0' # inside the isolated container; host only publishes on 127.0.0.1
      PORT: '8787'
      # Internal chokepoints exploration: read_tainted scope (include_tainted). Tailnet-only surface —
      # restricted records are NEVER published to the public site (ADR 0013).
      CHOKEPOINTS_API_URL: ${CHOKEPOINTS_API_URL:-https://srv1305127.tail880531.ts.net/api}
      CHOKEPOINTS_API_TOKEN: ${CHOKEPOINTS_API_TOKEN_TAINTED:-}
      CHOKEPOINTS_INCLUDE_TAINTED: 'true'
      # Editorial contradiction / red team (ADR 0039). Server-side only; the key never reaches the
      # browser. Opt-in: with COCKPIT_LLM_ENABLED unset (or no key) the tool returns an offline facade.
      LLM_ENABLED: ${COCKPIT_LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # LLM judge / pré-validation (ADR 0068): a REASONING model via the Responses API, tuned by effort.
      # Key falls back to OPENAI_API_KEY; model defaults to gpt-5.6-terra (a reasoning model, NOT gpt-4o).
      OPENAI_JUDGE_API_KEY: ${OPENAI_JUDGE_API_KEY:-}
      OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-}
      OPENAI_JUDGE_EFFORT: ${OPENAI_JUDGE_EFFORT:-}
    ports:
      - '127.0.0.1:8787:8787'
    # Reports, does not repair: `restart: unless-stopped` reacts to a process that EXITS, never to
    # one that is alive and wedged. This makes the difference visible in `docker ps` (and to any
    # future supervisor) instead of leaving a hung service indistinguishable from a healthy one.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-m', '5', 'http://127.0.0.1:8787/api/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: ['npm', '--workspace', '@ag/cockpit', 'start']

  # Public site www.applied-geopolitics.com — Caddy serves the static Astro build with automatic
  # HTTPS (Let's Encrypt). Ports bind the PUBLIC IP only (not 0.0.0.0) so they never collide with the
  # cockpit's `tailscale serve` on the Tailscale interface (ADR 0010). Cert provisions once DNS points
  # at PUBLIC_IP. Build the site first: npm --workspace @ag/public run build.
  public:
    image: caddy:2.8-alpine
    # Probes Caddy's admin API, not the site root: `http://127.0.0.1/` answers a 308 to HTTPS, and the
    # loopback TLS handshake then fails for want of a certificate for `127.0.0.1` — the probe would
    # report a permanently unhealthy container while the site serves perfectly.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - lead # Caddy reverse_proxies /api/* to the lead service; start it first
      - hdde # Caddy fronts hdde.applied-geopolitics.com → hdde service (ADR 0033)
      - verdict # Caddy fronts verdict.applied-geopolitics.com → verdict service (ADR 0041)
      - plausible # Caddy proxies /p/script.js + /p/event → plausible (ADR 0076)
    ports:
      - '${PUBLIC_IP:-72.61.101.1}:80:80'
      - '${PUBLIC_IP:-72.61.101.1}:443:443'
      - '${PUBLIC_IP:-72.61.101.1}:443:443/udp'
    volumes:
      - ../apps/public/dist:/srv:ro
      - ../apps/hdde-web/dist:/srv-hdde:ro # built HDDE SPA (build first: npm --workspace @ag/hdde-web run build)
      - ../apps/verdict-web/dist:/srv-verdict:ro # built VERDICT SPA (build first: npm --workspace @ag/verdict-web run build)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Self-hosted lead endpoint (POST /api/lead). Public only via Caddy reverse_proxy (no host port).
  # Writes leads into the cockpit acquisition pipeline (apps/cockpit/data/contacts.json). Set SMTP_*
  # to enable email notifications (ADR 0006 / 0011).
  lead:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: app-geo-tools:local
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      HOST: '0.0.0.0'
      PORT: '8080'
      # Email notification of a new lead. Values come from docker/.env (never inlined here — the file
      # is versioned, .env is not). SMTP_HOST empty ⇒ email.ts no-ops and the lead is stored only,
      # which is why an unset password loses no data but loses every notification.
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_SECURE: '${SMTP_SECURE:-false}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      LEAD_TO: '${LEAD_TO:-contact@applied-geopolitics.com}'
      LEAD_FROM: '${LEAD_FROM:-no-reply@applied-geopolitics.com}'
    # Reports, does not repair: `restart: unless-stopped` reacts to a process that EXITS, never to
    # one that is alive and wedged. This makes the difference visible in `docker ps` (and to any
    # future supervisor) instead of leaving a hung service indistinguishable from a healthy one.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-m', '5', 'http://127.0.0.1:8080/api/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: ['npm', '--workspace', '@ag/lead-api', 'start']

  # Hidden Dependency Discovery Engine API (ADR 0032/0033). Public ONLY via Caddy at
  # hdde.applied-geopolitics.com, behind auth. Binds the host loopback; Caddy reverse_proxies /api/*.
  # Seed the first account once running:
  #   docker compose -f docker/docker-compose.yml run --rm tools \
  #     npm --workspace @ag/hdde-api run seed:user -- you@example.com "a-long-password" owner_admin
  hdde:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: app-geo-tools:local
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace # SQLite + exports persist under apps/hdde-api/data (git-ignored)
    environment:
      HOST: '0.0.0.0' # inside the isolated container; Caddy reaches it by service name
      PORT: '8090'
      APP_ENV: production
      HDDE_DB_PATH: /workspace/apps/hdde-api/data/hdde.sqlite
      HDDE_EXPORTS_DIR: /workspace/apps/hdde-api/data/exports
      SESSION_SECRET: ${HDDE_SESSION_SECRET:-change-me-to-a-long-random-string}
      ALLOW_SIGNUP: 'false'
      COOKIE_SECURE: 'true' # served over HTTPS by Caddy
      # OpenAI red team (ADR 0034). Set the key in docker/.env to enable; empty → offline facade.
      LLM_ENABLED: ${HDDE_LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # Chokepoints Read API — READ SCOPE ONLY, never read_tainted (ADR 0035). Feeds interview + red team.
      CHOKEPOINTS_API_URL: ${CHOKEPOINTS_API_URL:-https://srv1305127.tail880531.ts.net/api}
      CHOKEPOINTS_API_TOKEN: ${CHOKEPOINTS_API_TOKEN:-}
      # Internal read-only ingestion API for VERDICT (ADR 0042). Shared service token; empty disables
      # the surface entirely. Caddy also 404s /api/internal/* publicly. Must match the verdict service.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      - '127.0.0.1:8090:8090'
    # Reports, does not repair: `restart: unless-stopped` reacts to a process that EXITS, never to
    # one that is alive and wedged. This makes the difference visible in `docker ps` (and to any
    # future supervisor) instead of leaving a hung service indistinguishable from a healthy one.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-m', '5', 'http://127.0.0.1:8090/api/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: ['npm', '--workspace', '@ag/hdde-api', 'start']

  # VERDICT — Premium strategic decision-arbitrage cockpit (ADR 0041–0043). SEPARATE container, own
  # SQLite + exports. Public ONLY via Caddy at verdict.applied-geopolitics.com, behind auth. Binds the
  # host loopback; Caddy reverse_proxies /api/*. Reads HDDE diagnostics over the compose network via the
  # internal API (ADR 0042) — never via Caddy. Seed the first account once running:
  #   docker compose -f docker/docker-compose.yml run --rm tools \
  #     npm --workspace @ag/verdict-api run seed:user -- you@example.com "a-long-password" owner_admin
  verdict:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: app-geo-tools:local
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace # SQLite + exports persist under apps/verdict-api/data (git-ignored)
    environment:
      HOST: '0.0.0.0' # inside the isolated container; Caddy reaches it by service name
      PORT: '8095'
      APP_ENV: production
      VERDICT_DB_PATH: /workspace/apps/verdict-api/data/verdict.sqlite
      VERDICT_EXPORTS_DIR: /workspace/apps/verdict-api/data/exports
      ALLOW_SIGNUP: 'false'
      COOKIE_SECURE: 'true' # served over HTTPS by Caddy
      # HDDE ingestion (ADR 0042): reach HDDE by service name on the compose network, with the shared
      # service token. Both must carry the SAME INTERNAL_API_TOKEN.
      HDDE_INTERNAL_URL: http://hdde:8090
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # OpenAI arbitrage red team (ADR 0034). VERDICT_LLM_ENABLED gates it; empty key → offline facade.
      LLM_ENABLED: ${VERDICT_LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # Chokepoints Read API — READ SCOPE ONLY, never read_tainted (ADR 0035).
      CHOKEPOINTS_API_URL: ${CHOKEPOINTS_API_URL:-https://srv1305127.tail880531.ts.net/api}
      CHOKEPOINTS_API_TOKEN: ${CHOKEPOINTS_API_TOKEN:-}
    ports:
      - '127.0.0.1:8095:8095'
    # Reports, does not repair: `restart: unless-stopped` reacts to a process that EXITS, never to
    # one that is alive and wedged. This makes the difference visible in `docker ps` (and to any
    # future supervisor) instead of leaving a hung service indistinguishable from a healthy one.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-m', '5', 'http://127.0.0.1:8095/api/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: ['npm', '--workspace', '@ag/verdict-api', 'start']

  # Slack listener, SOCKET MODE (ADR 0071/0074, P2). No published port and no Caddy rule on purpose:
  # the process opens an OUTBOUND WebSocket to Slack, so promoting from a phone adds ZERO public
  # surface. Classic interactivity would have required a public HTTPS endpoint that mutates the public
  # Atlas — the opposite of how this deployment is built. Reaches the cockpit over the Docker network.
  #
  # Inert until SLACK_APP_TOKEN / SLACK_BOT_TOKEN / SLACK_CHANNEL_ID exist in docker/.env: it logs why
  # and exits 0; the restart policy below is what keeps that from becoming a loop.
  slackbot:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: app-geo-tools:local
    user: '${UID:-1000}:${GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace
    depends_on:
      - cockpit
    environment:
      SLACK_APP_TOKEN: '${SLACK_APP_TOKEN:-}'
      SLACK_BOT_TOKEN: '${SLACK_BOT_TOKEN:-}'
      SLACK_CHANNEL_ID: '${SLACK_CHANNEL_ID:-}'
      SLACK_OPERATOR_NAME: '${SLACK_OPERATOR_NAME:-Sylvain Geffroy}'
      COCKPIT_URL: 'http://cockpit:8787'
    # `on-failure`, NOT `unless-stopped`: the latter restarts on ANY exit code, so the unconfigured
    # service — which logs why and exits 0 on purpose — would restart every second for ever. Here a
    # clean exit means "nothing to do", and only a crash is worth retrying.
    restart: on-failure
    command: ['npm', '--workspace', '@ag/slackbot', 'start']

  # ── Audience measurement: Plausible Community Edition (ADR 0076) ────────────────────────────────
  #
  # Cookieless by design, so no consent banner is required and the privacy policy stays short. Data
  # never leaves this box.
  #
  # No new DNS record: the two TRACKING endpoints are proxied by Caddy under /p/* on www (which also
  # keeps them clear of ad-blocker lists), and the DASHBOARD is bound to the host loopback and
  # published by `tailscale serve`, exactly like the cockpit. So nothing here is publicly reachable
  # except the two endpoints a browser must reach to record a hit.
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plausible
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: '${PLAUSIBLE_DB_PASSWORD:?PLAUSIBLE_DB_PASSWORD manquant dans docker/.env}'
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plausible -d plausible']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    volumes:
      - plausible_events_data:/var/lib/clickhouse
      # Tuned down for a shared box with no swap — see the header of docker/clickhouse/config.xml.
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/ag-limits.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/ag-limits.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  plausible:
    image: ghcr.io/plausible/community-edition:v3
    restart: unless-stopped
    depends_on:
      plausible_db: { condition: service_healthy }
      plausible_events_db: { condition: service_healthy }
    # Loopback only: the dashboard is an internal surface, fronted by Tailscale like the cockpit.
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      # The tailnet dashboard URL — NOT the public site. Only /p/* on www is public, and those two
      # routes are rewritten by Caddy, so BASE_URL never has to be reachable from the internet.
      # Must match what `tailscale serve --https=8443` publishes, or the dashboard emits login links
      # and redirects to a URL nobody can reach.
      BASE_URL: '${PLAUSIBLE_BASE_URL:-https://srv1100990.tail880531.ts.net:8443}'
      SECRET_KEY_BASE: '${PLAUSIBLE_SECRET_KEY_BASE:?PLAUSIBLE_SECRET_KEY_BASE manquant dans docker/.env}'
      TOTP_VAULT_KEY: '${PLAUSIBLE_TOTP_VAULT_KEY:?PLAUSIBLE_TOTP_VAULT_KEY manquant dans docker/.env}'
      DATABASE_URL: 'postgres://plausible:${PLAUSIBLE_DB_PASSWORD}@plausible_db:5432/plausible'
      CLICKHOUSE_DATABASE_URL: 'http://plausible_events_db:8123/plausible_events_db'
      # Single-operator instance: nobody should be able to create an account on it. A FRESH instance
      # has no users, so registration must be opened once to create the owner, then closed again —
      # set PLAUSIBLE_DISABLE_REGISTRATION=false in docker/.env, register over the tailnet, remove it.
      # The committed default is the safe one.
      DISABLE_REGISTRATION: '${PLAUSIBLE_DISABLE_REGISTRATION:-true}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8000/api/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"

volumes:
  caddy_data:
  caddy_config:
  plausible_db_data:
  plausible_events_data:
