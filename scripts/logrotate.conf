# Rotation for the app-geo cron logs.
#
# WHY user-level rather than /etc/logrotate.d: the deploy account has no passwordless sudo, and these
# logs belong to the deployment, not to the system. `logrotate` is run from the deploy crontab with
# its own state file (~/.logrotate.state), so nothing here needs root.
#
#   /usr/sbin/logrotate -s "$HOME/.logrotate.state" /home/deploy/app-geo/scripts/logrotate.conf
#
# `copytruncate` is deliberate: the writers are long-lived shell redirections opened by cron
# (`>> file`), which keep writing to the same inode. Renaming the file under them would leave the
# rotated copy growing and the fresh file empty for ever — the classic silent rotation failure.
# copytruncate copies then truncates in place, so the open descriptor keeps working.

/home/deploy/app-geo/scripts/redeploy-public.log
/home/deploy/app-geo/scripts/redteam-injection.log
/home/deploy/app-geo/scripts/backup.log
/home/deploy/app-geo/scripts/news-stream.log
/home/deploy/app-geo/scripts/news-pulse.log
/home/deploy/app-geo/scripts/consumer/drift.log
{
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su deploy deploy
    create 0644 deploy deploy
}
